; ShaderPlayer-RA factory defaults, bundled beside the exe.
; Seeded into a user's settings.ini on first run, and re-applied by "Restore Defaults".
; Editing this file changes what a fresh install (or a restore) starts with.
;
; [ui]        favouritesOnly  -- start the Shader Settings panel filtered to favourites
; [defaultN]  shader          -- preset path, relative to the shaders folder, forward slashes
;             favourites      -- comma-separated parameter names to star by default

[ui]
favouritesOnly=true

[default0]
shader=crt/crt-royale.slangp
favourites=interlace_detect_toggle
